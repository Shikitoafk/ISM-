<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="60" fill="#ffffff"/>
  <g transform="translate(50, 110)">
    <!-- Flask Body 'I' -->
    <path d="M 60 40 H 120 M 80 40 V 80 L 40 170 C 34 184 42 195 56 195 H 124 C 138 195 146 184 140 170 L 100 80 V 40" stroke="#1e3a5f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 34 195 H 146" stroke="#1e3a5f" stroke-width="18" stroke-linecap="round"/>

    <!-- Molecule inside Flask -->
    <line x1="64" y1="156" x2="88" y2="136" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
    <line x1="64" y1="156" x2="72" y2="176" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
    <line x1="88" y1="136" x2="72" y2="176" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="64" cy="156" r="11" fill="#1e3a5f"/>
    <circle cx="88" cy="136" r="11" fill="#1e3a5f"/>
    <circle cx="72" cy="176" r="11" fill="#1e3a5f"/>

    <!-- DNA Helix inside Flask -->
    <path d="M 96 176 Q 108 156 124 176" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 96 156 Q 108 176 124 156" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Letter 'S' -->
    <path d="M 238 76 C 198 64 165 92 165 120 C 165 164 238 156 238 184 C 238 204 205 212 169 200" stroke="#1e3a5f" stroke-width="32" stroke-linecap="round" fill="none"/>

    <!-- Letter 'M' — shifted right so the round cap of the S no longer
         collides with the M's left stem. -->
    <path d="M 286 195 V 64 L 340 152 L 394 64 V 195" stroke="#1e3a5f" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
